<mat-toolbar class="shell-toolbar">
  <span class="shell-brand">{{ appName }}</span>

  <!-- Desktop navigation -->
  <nav class="shell-nav" aria-label="Navegación principal">
    @for (link of links; track link.path) {
      <a
        mat-button
        [routerLink]="link.path"
        routerLinkActive="shell-link-active"
        ariaCurrentWhenActive="page"
        >{{ link.label }}</a
      >
    }
  </nav>

  <span class="shell-spacer"></span>

  <!-- Compact navigation (small screens) -->
  <button
    mat-icon-button
    class="shell-menu-button"
    [matMenuTriggerFor]="navMenu"
    aria-label="Abrir menú de navegación"
  >
    <mat-icon>menu</mat-icon>
  </button>
  <mat-menu #navMenu="matMenu">
    @for (link of links; track link.path) {
      <a mat-menu-item [routerLink]="link.path" routerLinkActive="shell-link-active">
        {{ link.label }}
      </a>
    }
  </mat-menu>


  <button
  mat-icon-button
  [matMenuTriggerFor]="themeMenu"
  [attr.aria-label]="'Tema: ' + currentTheme().label"
>
  <mat-icon aria-hidden="true">{{ currentTheme().icon }}</mat-icon>
</button>
<mat-menu #themeMenu="matMenu" aria-label="Tema">
  @for (option of themeOptions; track option.value) {
    <button
      mat-menu-item
      role="menuitemradio"
      [attr.aria-checked]="theme.preference() === option.value"
      (click)="theme.set(option.value)"
    >
      <mat-icon aria-hidden="true">{{ option.icon }}</mat-icon>
      <span>{{ option.label }}</span>
      @if (theme.preference() === option.value) {
        <mat-icon class="menu-check" aria-hidden="true">check</mat-icon>
      }
    </button>
  }
</mat-menu>

  <!-- User menu -->
  <button mat-button class="shell-user-button" [matMenuTriggerFor]="userMenu" [attr.aria-label]="'Cuenta de ' + (userName()?.name ?? '')">
    <mat-icon>account_circle</mat-icon>
    <span class="shell-user-name">{{ userName()?.name }}</span>
  </button>
  <mat-menu #userMenu="matMenu">
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Cerrar sesión</span>
    </button>
  </mat-menu>
</mat-toolbar>

<main class="shell-content">
  <router-outlet />
</main>
