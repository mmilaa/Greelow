<article class="card">
  <header class="card__header">
    <h2 class="card__name">
      <a class="card__link" [routerLink]="['/accounts', row().account.id]">
        {{ row().account.name }}
      </a>
    </h2>
    <span class="card__currency">{{ row().account.currency }}</span>
  </header>

  <dl class="card__balances">
    <div class="card__row">
      <dt class="card__label">Saldo</dt>
      <dd class="card__value">
        <app-money-amount [amount]="row().account.balance" />
      </dd>
    </div>

    @if (row().hasPending && row().available) {
      <div class="card__row">
        <dt class="card__label">Disponible</dt>
        <dd class="card__value">
          <app-money-amount [amount]="row().available!" />
        </dd>
      </div>
      <p class="card__notice">
        <mat-icon class="card__notice-icon" aria-hidden="true">hourglass_empty</mat-icon>
        <span>Hay transferencias en proceso</span>
      </p>
    }
  </dl>

  <p class="card__id">
    <span class="card__id-label">id de cuenta</span>
    <span class="card__id-value">{{ row().account.id }}</span>
  </p>
</article>
