<div class="movement">
  <div class="movement__main">
    <span class="movement__type">{{ typeLabel() }}</span>
    @if (movement().description) {
      <span class="movement__description">{{ movement().description }}</span>
    }
    @if (categoryText(); as cat) {
      <span class="movement__category">{{ cat }}</span>
    }
    <time class="movement__date" [attr.datetime]="movement().createdAt">{{ dateText() }}</time>
  </div>

  <div class="movement__side">
    <span class="movement__amount" [class.movement__amount--unsettled]="!settled()">
      <app-money-amount [amount]="signed()" />
    </span>
    <app-status-chip [status]="movement().status" />
  </div>
</div>
